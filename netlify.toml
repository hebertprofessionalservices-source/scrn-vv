# Netlify build config. The Next.js app lives in web/; Netlify's OpenNext
# runtime (@netlify/plugin-nextjs) is picked up automatically.
[build]
  base = "web"
  command = "pnpm build"
  publish = ".next"
  # Data-only pushes go live from GitHub without a rebuild.
  ignore = "node scripts/netlify-ignore.mjs"

[build.environment]
  NODE_VERSION = "24"

# Auto-install didn't happen for this API-created site, so declare it.
# Left unpinned so Netlify keeps it current.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Server code reads the scraped JSON off disk (lib/data-server.ts,
# lib/history-server.ts), so make sure it ships with the SSR function.
[functions]
  included_files = ["public/data/**"]
